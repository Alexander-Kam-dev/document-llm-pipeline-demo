name: "Feature request"
description: "Add a new capability (schema, parsing, endpoints, storage, etc.)."
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: "What are we adding and why?"
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: "What is in scope / out of scope?"
      placeholder: |
        In scope:
        - ...

        Out of scope:
        - ...
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: "How will we know this is done?"
      placeholder: |
        - New/updated tests
        - Updated docs
        - Endpoint contract defined
    validations:
      required: true
